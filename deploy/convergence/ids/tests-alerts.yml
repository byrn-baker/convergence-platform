rule_files:
  - ../prometheus/alerts/ids.rules.yml
evaluation_interval: 30s
tests:
  - name: Backfill must not hide Loki failures
    interval: 30s
    input_series:
      - series: 'netclaw_ids_delivery_oldest_age_seconds{destination="loki",sensor="test",site="home"}'
        values: '600+0x20'
      - series: 'netclaw_ids_delivery_oldest_age_seconds{destination="victorialogs",sensor="test",site="home"}'
        values: '600+0x20'
      - series: 'netclaw_ids_archive_backfill_active'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: IDSDeliveryBacklog
        exp_alerts:
          - exp_labels: {destination: loki, sensor: test, site: home, severity: warning, investigate: "false"}
            exp_annotations:
              summary: "IDS delivery is behind (loki, test)"
  - name: Backfill must not hide a stopped archive destination
    interval: 30s
    input_series:
      - series: 'netclaw_ids_delivery_pending_events{destination="victorialogs",sensor="test",site="home"}'
        values: '10+0x20'
      - series: 'netclaw_ids_delivery_last_success_timestamp_seconds{destination="victorialogs"}'
        values: '0+0x20'
      - series: 'netclaw_ids_archive_backfill_active'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: IDSDeliveryStalled
        exp_alerts:
          - exp_labels: {destination: victorialogs, severity: warning, investigate: "false"}
            exp_annotations:
              summary: "IDS destination has stopped acknowledging data (victorialogs)"
  - name: Low ingest volume warns, then escalates, and recovers
    interval: 1m
    input_series:
      - series: 'netclaw_ids_store_disk_total_bytes'
        values: '100+0x60'
      - series: 'netclaw_ids_store_disk_free_bytes'
        values: '50+0x9 19+0x19 9+0x19 30+0x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: IDSStorageLow
      - eval_time: 26m
        alertname: IDSStorageLow
        exp_alerts:
          - exp_labels: {severity: warning, investigate: "false"}
            exp_annotations:
              summary: "IDS ingest volume is below 20% free"
      - eval_time: 33m
        alertname: IDSStorageCritical
      - eval_time: 36m
        alertname: IDSStorageCritical
        exp_alerts:
          - exp_labels: {severity: critical, investigate: "false"}
            exp_annotations:
              summary: "IDS ingest volume is below 10% free; ingestion stops at 512 MiB"
      - eval_time: 55m
        alertname: IDSStorageLow
