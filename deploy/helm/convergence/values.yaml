victoria:
  alerting:
    # Mounted only when it exists: templates/agent-metrics-rules.yaml (agentMetrics.quota).
    extraRuleConfigMaps: ['{{ .Release.Name }}-agent-metrics-rules']
agentMetrics:
  # Weekly token-budget alerts for NetClaw's metered models, from the agent metrics exporter
  # (services/agent-metrics, job netclaw-openclaw). Token totals are a proxy for a provider's
  # usage cap; see docs/convergence/setup/agent-metrics.md to calibrate. Off by default.
  quota:
    enabled: false
    modelRegex: ''           # required when enabled: PromQL regex of the metered models, e.g. 'deepseek.*'
    weeklyTokenBudget: 0     # required when enabled: calibrated input+output tokens per week
    projectionWarnRatio: 0.8 # warning: the week projected from the last day passes this share (30m)
    burnCriticalRatio: 0.9   # critical: the last 7 days pass this share (15m)
nodeSelector: {}
imagePullSecrets: []
existingSecret: ''
queryAccess:
  enabled: false
  metricsNodePort: 30429
  logsNodePort: 30428
siteConfig:
  home:
    name: Home
    wanInterface: wan
    speedtestTarget: 1000000000
api:
  enabled: true
  image: {repository: netclaw-convergence-api, tag: '', pullPolicy: IfNotPresent}
  nodeSelector: {}
  service: {type: ClusterIP, nodePort: null}
  rateLimitPerMinute: 1000
  idsEnabled: false
  alertReceiverUrl: ''
  # All application secrets come from an independently managed K8s Secret.
  env: {}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
postgres:
  image: postgres:16-alpine
  storage: {className: longhorn, size: 10Gi}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 768Mi}
loki:
  enabled: true
  image: grafana/loki:3.1.0
  retention: 336h
  storage: {className: longhorn, size: 10Gi, existingClaim: ''}
  service: {type: ClusterIP, nodePort: null}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 1Gi}
blackbox:
  enabled: true
  image: prom/blackbox-exporter:v0.25.0
  config:
    modules:
      http_2xx: {prober: http, timeout: 5s, http: {preferred_ip_protocol: ip4}}
      icmp: {prober: icmp, timeout: 5s, icmp: {preferred_ip_protocol: ip4}}
      tcp_connect: {prober: tcp, timeout: 5s}
# Optional device sources are explicitly enabled; no devices are reconfigured.
unifi:
  enabled: false
  image: python:3.12-alpine
  controllerUrl: ''
pushgateway:
  enabled: true
  image: prom/pushgateway:v1.10.0
speedtest:
  enabled: false
  replicas: 1
  image: python:3.12-slim
  site: home
  intervalSeconds: 3600
flowLogs:
  enabled: false
  config: {}
  stateDirectory: ''
ids:
  enabled: false
  replicas: 1
  image: {repository: netclaw-ids-ingest, tag: '', pullPolicy: IfNotPresent}
  existingSecret: ''
  existingClaim: ''
  service: {type: ClusterIP, nodePort: null}
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: '2', memory: 6Gi}
  ipContextSchedule: '17 4 * * *'
# Optional private dashboard for fresh installs. Existing shared Grafana is untouched.
grafana:
  enabled: false
  image: grafana/grafana:12.3.3
  storage: {className: local-path, size: 1Gi}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
# Dedicated, installation-authenticated reviewer service and browser origin.
# Run the reviewer DB migration separately before enabling these workloads.
reviewer:
  enabled: false
  publicOrigin: ''          # exact HTTPS browser origin, without a path
  apiImage: ''              # tag or digest containing reviewer-service.js
  hudImage: ''              # tag or digest containing reviewer/start.mjs
  databaseSecret: ''        # PGHOST, PGPORT, PGUSER, PGDATABASE, PGPASSWORD
  serviceTlsSecret: ''      # tls.crt, tls.key, ca.crt (client CA), enrolled.json
  installationTlsSecret: '' # tls.crt, tls.key (client identity), ca.crt (service CA)
  browserTlsSecret: ''      # tls.crt, tls.key for publicOrigin
