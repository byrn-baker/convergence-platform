victoria:
  alerting:
    ruleFiles:
      # Model-quota early warning from the NetClaw host's agent metrics exporter
      # (services/agent-metrics, job netclaw-openclaw). Token totals are a proxy for a
      # provider's usage cap. The budget file is site-specific: replace it with your metered
      # models and calibrated weekly budget, or set it to {groups: []} to turn the alerts off
      # (docs/convergence/setup/agent-metrics.md). Without its series the alerts never fire.
      netclaw-quota-budget.yml:
        groups:
          - name: netclaw-quota-budget
            rules:
              - record: netclaw:quota_tokens_1d
                expr: >-
                  sum(increase({__name__=~"netclaw_model_(input|output)_tokens_total", model=~"deepseek.*"}[1d]))
              - record: netclaw:quota_tokens_7d
                expr: >-
                  sum(increase({__name__=~"netclaw_model_(input|output)_tokens_total", model=~"deepseek.*"}[7d]))
              - record: netclaw:quota_weekly_token_budget
                expr: vector(200000000)
      netclaw-quota.yml:
        groups:
          - name: netclaw-quota
            rules:
              - record: netclaw:quota_tokens_weekly_projection
                expr: 7 * netclaw:quota_tokens_1d
              - alert: NetclawQuotaProjectionHigh
                expr: netclaw:quota_tokens_weekly_projection > on() (0.8 * netclaw:quota_weekly_token_budget)
                for: 30m
                labels: {severity: warning, service: netclaw, investigate: 'false'}
                annotations:
                  summary: Metered model tokens projected above 80% of the weekly budget (proxy)
                  description: >-
                    At the current daily rate, the metered models' weekly token use exceeds 80% of
                    the calibrated budget (netclaw-quota-budget.yml). Confirm against the provider's
                    own usage figure and consider routing routine work to local models.
              - alert: NetclawQuotaBurn7dCritical
                expr: netclaw:quota_tokens_7d > on() (0.9 * netclaw:quota_weekly_token_budget)
                for: 15m
                labels: {severity: critical, service: netclaw, investigate: 'false'}
                annotations:
                  summary: Metered model tokens over the last 7 days above 90% of the weekly budget (proxy)
                  description: >-
                    Rolling 7-day token use of the metered models has passed 90% of the calibrated
                    weekly budget (netclaw-quota-budget.yml). Confirm against the provider's own
                    usage figure; switch the default model to a local one to protect the cap.
nodeSelector: {}
imagePullSecrets: []
existingSecret: ''
queryAccess:
  enabled: false
  metricsNodePort: 30429
  logsNodePort: 30428
siteConfig:
  home:
    name: Home
    wanInterface: wan
    speedtestTarget: 1000000000
api:
  enabled: true
  image: {repository: netclaw-convergence-api, tag: '', pullPolicy: IfNotPresent}
  nodeSelector: {}
  service: {type: ClusterIP, nodePort: null}
  rateLimitPerMinute: 1000
  idsEnabled: false
  alertReceiverUrl: ''
  # All application secrets come from an independently managed K8s Secret.
  env: {}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
postgres:
  image: postgres:16-alpine
  storage: {className: longhorn, size: 10Gi}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 768Mi}
loki:
  enabled: true
  image: grafana/loki:3.1.0
  retention: 336h
  storage: {className: longhorn, size: 10Gi, existingClaim: ''}
  service: {type: ClusterIP, nodePort: null}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 1Gi}
blackbox:
  enabled: true
  image: prom/blackbox-exporter:v0.25.0
  config:
    modules:
      http_2xx: {prober: http, timeout: 5s, http: {preferred_ip_protocol: ip4}}
      icmp: {prober: icmp, timeout: 5s, icmp: {preferred_ip_protocol: ip4}}
      tcp_connect: {prober: tcp, timeout: 5s}
# Optional device sources are explicitly enabled; no devices are reconfigured.
unifi:
  enabled: false
  image: python:3.12-alpine
  controllerUrl: ''
pushgateway:
  enabled: true
  image: prom/pushgateway:v1.10.0
speedtest:
  enabled: false
  replicas: 1
  image: python:3.12-slim
  site: home
  intervalSeconds: 3600
flowLogs:
  enabled: false
  config: {}
  stateDirectory: ''
ids:
  enabled: false
  replicas: 1
  image: {repository: netclaw-ids-ingest, tag: '', pullPolicy: IfNotPresent}
  existingSecret: ''
  existingClaim: ''
  service: {type: ClusterIP, nodePort: null}
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: '2', memory: 6Gi}
  ipContextSchedule: '17 4 * * *'
# Optional private dashboard for fresh installs. Existing shared Grafana is untouched.
grafana:
  enabled: false
  image: grafana/grafana:12.3.3
  storage: {className: local-path, size: 1Gi}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
