---
# Removes K3s and its data from every node in the inventory. Workloads and volumes
# on these nodes are destroyed.
- name: Reset K3s
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Uninstall agent
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      args: {removes: /usr/local/bin/k3s-agent-uninstall.sh}
    - name: Uninstall server
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      args: {removes: /usr/local/bin/k3s-uninstall.sh}
    - name: Remove keepalived
      ansible.builtin.apt: {name: keepalived, state: absent, purge: true}
