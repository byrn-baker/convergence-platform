---
# Load locally built images into every node's containerd, so the cluster needs no
# registry.  -e image_archives='["/path/api.tar", "/path/ids.tar"]'
- name: Import images
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Copy archives
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/tmp/{{ item | basename }}"
        mode: "0600"
      loop: "{{ image_archives }}"
    - name: Import into containerd
      ansible.builtin.command: "k3s ctr -n k8s.io images import /var/tmp/{{ item | basename }}"
      loop: "{{ image_archives }}"
      changed_when: true
    - name: Remove archives
      ansible.builtin.file:
        path: "/var/tmp/{{ item | basename }}"
        state: absent
      loop: "{{ image_archives }}"
