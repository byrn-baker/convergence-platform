<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case review · Convergence</title>
  <link rel="stylesheet" href="/reviewer.css">
  <script type="module" src="/reviewer.js"></script>
</head>
<body>
  <header><a class="brand" href="/" aria-label="Convergence case review">Convergence</a>
    <div id="account" hidden><span id="identity"></span><button type="button" id="logout">Sign out</button></div>
  </header>
  <main>
    <h1>Investigation review</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <button type="button" id="reconnect" hidden>Check session</button>
    <form id="login" method="post" action="/review/sign-in" hidden>
      <h2>Sign in</h2>
      <label>Username<input name="username" required maxlength="128" autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
    <section id="workspace" aria-label="Reviewer workspace" hidden>
      <form id="lookup">
        <label>Site<select name="site" required></select></label>
        <label>Case ID<input name="caseId" required maxlength="36" autocomplete="off" spellcheck="false"></label>
        <button type="submit">Open case</button>
      </form>
      <article id="detail" hidden>
        <div class="case-heading"><h2 id="case-title"></h2><span id="case-status"></span></div>
        <dl id="facts"></dl>
        <section id="assessment" hidden><h3>Assessment</h3><div></div></section>
        <section id="current" hidden><h3>Current disposition</h3><div></div></section>
        <section><h3>Review history</h3><div id="history"></div></section>
        <form id="disposition" hidden>
          <h3>Record disposition</h3>
          <label>Outcome<select name="kind">
            <option value="needs_review">Needs review</option>
            <option value="expected_activity">Expected activity</option>
            <option value="false_positive">False positive</option>
            <option value="confirmed_threat">Confirmed threat</option>
          </select></label>
          <label>Evidence and reason<textarea name="reason" rows="3" required minlength="10" maxlength="4000"></textarea></label>
          <button type="submit">Save disposition</button>
        </form>
        <section id="operation" hidden>
          <h3>Disposition receipt</h3><p id="operation-note"></p><code id="operation-id"></code>
          <div class="actions">
            <button type="button" id="check-receipt" hidden>Check receipt</button>
            <button type="button" id="retry" hidden>Retry same operation</button>
          </div>
        </section>
      </article>
    </section>
  </main>
</body>
</html>
